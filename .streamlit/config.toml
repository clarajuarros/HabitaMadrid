[server]
headless = true
runOnSave = false
# Publish a complete verified edition, then reboot the Cloud process. Avoid
# module eviction while concurrent sessions import code during a Git pull.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#173d35"
backgroundColor = "#f5f7f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#173d35"
font = "sans serif"
